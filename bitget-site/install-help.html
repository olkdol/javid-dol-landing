sub:"No es algo propio de JaviD Future Bot. Le ocurre a casi todo programa hecho por una persona y no por una empresa.",
whoT:"Quién lo hizo", whoB:"JaviD Future Bot está escrito y distribuido por una sola persona — un desarrollador individual, no una empresa. Por eso exactamente tu sistema operativo no puede verificar al editor: la comprobación busca un certificado de pago emitido a una empresa registrada.",
whyT:"Por qué aparece el aviso",
whyB:"Windows y macOS solo omiten este aviso para software firmado con un certificado de firma de código: un producto de pago, renovado cada año, emitido a una empresa registrada. Yo no lo he comprado. Así que tu ordenador te dice la verdad: no puede verificar quién publicó este archivo. Ese mensaje no es el resultado de un antivirus ni un juicio sobre lo que hace el programa.",
winT:"Windows — el botón Ejecutar está oculto hasta pulsar Más información",
winStep1:"1. Lo que ves primero", winStep2:"2. Tras pulsar Más información",
ssTitle:"Windows protegió tu PC",
ssBody:"Microsoft Defender SmartScreen impidió el inicio de una aplicación no reconocida. Ejecutarla podría poner en riesgo tu PC.",
ssMore:"Más información", ssDont:"No ejecutar", ssRun:"Ejecutar de todas formas",
ssPub:"App: JaviD_Future_Bot.exe   Editor: Editor desconocido",
winHint:"En este punto solo hay un botón “No ejecutar”. La opción de ejecutar todavía no existe — aquí es donde la mayoría abandona.",
winDone:"Al pulsar “Más información” aparece “Ejecutar de todas formas”. Púlsalo y la app arranca con normalidad. El texto varía según la versión de Windows.",
macT:"macOS — Gatekeeper hace lo mismo",
gk15T:"No se abrió “JaviD Future Bot”", gk15B:"Apple no pudo verificar que “JaviD Future Bot” esté libre de malware que pueda dañar tu Mac o comprometer tu privacidad.",
gkTrash:"Mover a la papelera", gkOk:"Listo",
gk14T:"No se puede abrir “JaviD Future Bot”", gk14B:"porque proviene de un desarrollador no identificado.",
gkCancel:"Cancelar", gkOpen:"Abrir",
mac15:"Intenta abrirla una vez y deja que falle. Luego ve a Ajustes del Sistema → Privacidad y seguridad, baja del todo y pulsa “Abrir igualmente”. En Sequoia ya no funciona pulsar Control y hacer clic — Apple eliminó ese atajo.",
mac14:"Haz clic derecho (o Control-clic) en la app, elige Abrir y vuelve a pulsar Abrir en el diálogo.",
verT:"Comprueba el archivo tú mismo",
verB:"Ambas cosas sirven para cualquier archivo que descargues, no solo el mío:",
ver1:"Antes de ejecutar: sube el archivo a VirusTotal (gratis) y lee el análisis de unos 70 motores antivirus.",
ver2:"Después de ejecutar: abre el Monitor de recursos en Windows, o ejecuta lsof -i -P en macOS, y lee los hosts a los que se conecta. Deberías encontrar dos — tu exchange y una CDN.",
stop:"Si aun así no te convence, parar aquí es una decisión razonable. Puedes seguir el panel de la cuenta publicado sin instalar nada.",
hashT:"Comprueba que tienes el archivo que publiqué",
hashB:"Compara la suma de verificación de tu archivo con las dos de abajo. Si coinciden, nadie cambió el archivo entre mi servidor y tú. En Windows ejecuta certutil -hashfile <archivo> SHA256; en macOS shasum -a 256 <archivo>.",
hashN:"No he subido yo mismo estas versiones a VirusTotal, así que aquí todavía no hay enlace de análisis, solo los hashes — que puedes verificar sin fiarte de mí. Los instaladores sin firmar hechos con PyInstaller suelen recibir algunas detecciones heurísticas genéricas; un grupo de troyanos con nombre propio sería otra cosa.",
foot:"JaviD Future Bot — gratis, se ejecuta en tu propio PC.", back:"Volver a la página principal"},

fr:{_n:"Français",
h1:"Votre ordinateur bloquera cette application au premier lancement. Voici pourquoi et comment l'exécuter.",
sub:"Ce n'est pas propre à JaviD Future Bot. Cela arrive à presque tout programme réalisé par un particulier plutôt que par une entreprise.",
whoT:"Qui l'a fait", whoB:"JaviD Future Bot est écrit et distribué par une seule personne — un développeur indépendant, pas une entreprise. C'est exactement pour cela que votre système ne peut pas vérifier l'éditeur : le contrôle cherche un certificat payant délivré à une société enregistrée.",
whyT:"Pourquoi cet avertissement apparaît",
whyB:"Windows et macOS n'omettent cet avertissement que pour les logiciels signés avec un certificat de signature de code — un produit payant, renouvelé chaque année, délivré à une société enregistrée. Je n'en ai pas acheté. Votre ordinateur dit donc la vérité : il ne peut pas vérifier qui a publié ce fichier. Ce message n'est pas un résultat d'antivirus, ni un jugement sur ce que fait le programme.",
winT:"Windows — le bouton Exécuter reste caché jusqu'à « Informations complémentaires »",
winStep1:"1. Ce que vous voyez d'abord", winStep2:"2. Après avoir cliqué sur Informations complémentaires",

ssMore:"Informations complémentaires", ssDont:"Ne pas exécuter", ssRun:"Exécuter quand même",
ssPub:"Application : JaviD_Future_Bot.exe   Éditeur : Éditeur inconnu",
winHint:"À ce stade il n'y a qu'un bouton « Ne pas exécuter ». L'option d'exécution n'existe pas encore — c'est ici que la plupart abandonnent.",
winDone:"Cliquer sur « Informations complémentaires » fait apparaître « Exécuter quand même ». Cliquez dessus et l'application démarre normalement. Le texte varie selon la version de Windows.",
macT:"macOS — Gatekeeper fait la même chose",
gk15T:"« JaviD Future Bot » n'a pas été ouvert", gk15B:"Apple n'a pas pu vérifier que « JaviD Future Bot » est exempt de logiciels malveillants susceptibles d'endommager votre Mac ou de compromettre votre vie privée.",
gkTrash:"Placer dans la corbeille", gkOk:"Terminé",
gk14T:"Impossible d'ouvrir « JaviD Future Bot »", gk14B:"car il provient d'un développeur non identifié.",
gkCancel:"Annuler", gkOpen:"Ouvrir",
mac15:"Essayez de l'ouvrir une fois et laissez échouer. Allez ensuite dans Réglages Système → Confidentialité et sécurité, faites défiler vers le bas et cliquez sur « Ouvrir quand même ». Sur Sequoia, le Control-clic ne fonctionne plus — Apple a supprimé ce raccourci.",
mac14:"Faites un clic droit (ou Control-clic) sur l'app, choisissez Ouvrir, puis Ouvrir à nouveau dans la boîte de dialogue.",
verT:"Vérifiez le fichier vous-même",
verB:"Ces deux méthodes valent pour n'importe quel fichier téléchargé, pas seulement le mien :",
ver1:"Avant l'exécution : envoyez le fichier sur VirusTotal (gratuit) et lisez l'analyse d'environ 70 moteurs antivirus.",
ver2:"Après l'exécution : ouvrez le Moniteur de ressources sous Windows, ou lancez lsof -i -P sous macOS, et lisez les hôtes auxquels le programme se connecte. Vous devriez en trouver deux — votre plateforme et un CDN.",
stop:"Si cela ne vous suffit pas, s'arrêter ici est une décision raisonnable. Vous pouvez suivre le tableau de bord publié sans rien installer.",
hashT:"Vérifiez que vous avez bien le fichier que j'ai publié",
hashB:"Comparez la somme de contrôle de votre fichier aux deux valeurs ci-dessous. Si elles correspondent, personne n'a remplacé le fichier entre mon serveur et vous. Sous Windows : certutil -hashfile <fichier> SHA256 ; sous macOS : shasum -a 256 <fichier>.",
hashN:"Je n'ai pas moi-même envoyé ces versions sur VirusTotal, il n'y a donc pas encore de lien d'analyse ici, seulement les empreintes — que vous pouvez vérifier sans me faire confiance. Les installeurs non signés créés avec PyInstaller déclenchent couramment quelques détections heuristiques génériques ; une série de chevaux de Troie nommés serait tout autre chose.",
foot:"JaviD Future Bot — gratuit, fonctionne sur votre propre PC.", back:"Retour à la page principale"},

vi:{_n:"Tiếng Việt",
h1:"Máy tính sẽ chặn ứng dụng này ở lần chạy đầu. Đây là lý do và cách chạy nó.",
sub:"Đây không phải vấn đề riêng của JaviD Future Bot. Hầu hết chương trình do một cá nhân làm ra, thay vì một công ty, đều gặp điều này.",
whoT:"Ai đã làm ra nó", whoB:"JaviD Future Bot do một người viết và phát hành — một nhà phát triển cá nhân, không phải công ty. Đó chính xác là lý do hệ điều hành không xác minh được nhà phát hành: nó tìm một chứng chỉ trả phí cấp cho doanh nghiệp đã đăng ký.",
whyT:"Vì sao cảnh báo xuất hiện",
whyB:"Windows và macOS chỉ bỏ qua cảnh báo này với phần mềm được ký bằng chứng chỉ ký mã — một khoản trả phí, gia hạn hằng năm, cấp cho doanh nghiệp đã đăng ký. Tôi chưa mua. Vậy nên máy tính đang nói sự thật: nó không xác minh được ai phát hành tệp này. Thông báo đó không phải kết quả quét virus, cũng không phải đánh giá về việc chương trình làm gì.",
winT:"Windows — nút Chạy bị ẩn cho tới khi bấm Thông tin thêm",
winStep1:"1. Những gì bạn thấy trước tiên", winStep2:"2. Sau khi bấm Thông tin thêm",

ssMore:"Thông tin thêm", ssDont:"Không chạy", ssRun:"Vẫn chạy",

winDone:"Bấm “Thông tin thêm” sẽ hiện “Vẫn chạy”. Bấm vào đó và ứng dụng khởi động bình thường. Câu chữ khác nhau tùy phiên bản Windows.",

gk15T:"Không mở được “JaviD Future Bot”", gk15B:"Apple không thể xác minh “JaviD Future Bot” không chứa phần mềm độc hại có thể gây hại cho máy Mac hoặc xâm phạm quyền riêng tư của bạn.",
gkTrash:"Chuyển vào Thùng rác", gkOk:"Xong",
gk14T:"Không thể mở “JaviD Future Bot”", gk14B:"vì nó đến từ một nhà phát triển không xác định.",
gkCancel:"Hủy", gkOpen:"Mở",

ver1:"Trước khi chạy: tải tệp lên VirusTotal (miễn phí) và đọc kết quả từ khoảng 70 công cụ diệt virus.",

sub:"Bu, JaviD Future Bot'a özgü değil. Şirket yerine tek bir kişinin yaptığı neredeyse her programda olur.",

const ORDER = ["en","ko","ja","es","fr","vi","tr","pt"];
function apply(l){
  const t = T[l] || T.en;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el=>{
    const v = t[el.dataset.t]; if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll("#langs button").forEach(b=>
    b.setAttribute("aria-current", String(b.dataset.l === l)));
  try{ history.replaceState(null,"","?lang="+l); }catch(e){}
}
const nav = document.getElementById("langs");
ORDER.forEach(l=>{
  const b=document.createElement("button"); b.textContent=T[l]._n; b.dataset.l=l;
  b.onclick=()=>apply(l); nav.appendChild(b);
});
const q = new URLSearchParams(location.search).get("lang");
apply(T[q] ? q : (ORDER.find(l => (navigator.language||"en").toLowerCase().startsWith(l)) || "en"));
</script>
</body>
</html>
