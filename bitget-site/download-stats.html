<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Download Stats — JaviD Future Bot (bg)</title>
<style>
  :root{--bg:#f8fafc;--panel:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#4f46e5;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:48px 20px 80px;}
  h1{font-size:20px;font-weight:800;margin:0 0 4px;}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 28px;}
  .key-row{display:flex;gap:8px;margin-bottom:28px;}
  input[type="password"], input[type="text"]{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--panel);color:var(--text);}
  button{border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;border-radius:8px;padding:10px 18px;cursor:pointer;}
  button:hover{opacity:.92;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card .num{font-size:28px;font-weight:800;}
  .card .label{font-size:12px;color:var(--muted);margin-top:2px;}
  .platform-row{display:flex;gap:12px;}
  #msg{font-size:13px;color:var(--muted);min-height:18px;}
  #msg.error{color:#dc2626;}
  #updated{font-size:12px;color:var(--muted);margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Download Stats — bg.javidtrading.com</h1>
  <p class="sub">Enter your STATS_KEY to view download counts (recorded server-side by /api/download).</p>

  <div class="key-row">
    <input type="password" id="key" placeholder="STATS_KEY" autocomplete="off">
    <button id="go">View</button>
  </div>

  <div id="msg"></div>

  <div class="cards" id="cards" style="display:none;">
    <div class="card"><div class="num" id="total">0</div><div class="label">Total downloads</div></div>
    <div class="card"><div class="num" id="today">0</div><div class="label">Today</div></div>
    <div class="card"><div class="num" id="last7">0</div><div class="label">Last 7 days</div></div>
  </div>

  <div class="platform-row cards" id="platforms" style="display:none;">
    <div class="card"><div class="num" id="pWin">0</div><div class="label">Windows</div></div>
    <div class="card"><div class="num" id="pMac">0</div><div class="label">macOS</div></div>
  </div>

  <div id="updated"></div>
</div>

<script>
async function load() {
  const key = document.getElementById('key').value.trim();
  const msg = document.getElementById('msg');
  const cards = document.getElementById('cards');
  const platforms = document.getElementById('platforms');
  const updated = document.getElementById('updated');
  msg.className = ''; msg.textContent = 'Loading...';
  cards.style.display = 'none';
  platforms.style.display = 'none';

  if (!key) { msg.textContent = 'Enter your STATS_KEY first.'; return; }

  try {
    const res = await fetch('/api/download-stats?key=' + encodeURIComponent(key));
    const data = await res.json();
    if (!res.ok) {
      msg.className = 'error';
      msg.textContent = data.error === 'forbidden' ? 'Wrong key.' : (data.error || 'Something went wrong.');
      return;
    }
    document.getElementById('total').textContent = data.total;
    document.getElementById('today').textContent = data.today;
    document.getElementById('last7').textContent = data.last_7_days;
    document.getElementById('pWin').textContent = (data.by_platform && data.by_platform.windows) || 0;
    document.getElementById('pMac').textContent = (data.by_platform && data.by_platform.mac) || 0;
    cards.style.display = 'grid';
    platforms.style.display = 'grid';
    msg.textContent = '';
    updated.textContent = 'Updated ' + new Date().toLocaleString();
  } catch (e) {
    msg.className = 'error';
    msg.textContent = 'Network error — try again.';
  }
}

document.getElementById('go').addEventListener('click', load);
document.getElementById('key').addEventListener('keydown', function(e){ if (e.key === 'Enter') load(); });
</script>
</body>
</html>
